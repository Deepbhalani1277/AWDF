name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Run Automated Tests
    runs-on: ubuntu-latest

    # Service container: Provides live MongoDB for database integration tests
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set Up Node.js Environment (v18)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Install Monorepo & Service Dependencies
        run: |
          npm install
          npm --prefix backend install
          npm --prefix frontend install

      - name: 4. Build Frontend Production Bundle
        run: npm --prefix frontend run build

      - name: 5. Execute Backend Integration Test Suite
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5001
          JWT_SECRET: ci_pipeline_automated_secret_key_charusat_2026
          MONGO_URI: mongodb://127.0.0.1:27017/taskmanager_ci
